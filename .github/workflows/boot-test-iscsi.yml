name: boot-test-iscsi

run-name: boot test oraclecloud-iscsi ${{ inputs.channel }} ${{ inputs.version }}

# Build the oraclecloud-iscsi image of one release and boot it in QEMU/KVM, once
# from an iSCSI target and once from a plain disk (docs/oraclecloud-iscsi.md).
# Runs on pull requests that touch what the image is made of, and by hand.
# Nothing is released: build.yml boots the image it releases the same way.

on:
  pull_request:
    paths:
      - patches/**
      - overlay/**
      - scripts/oci-ibft.sh
      - scripts/boot-test-iscsi.sh
      - scripts/patch-oem.sh
      - scripts/build.sh
      - scripts/fetch.sh
      - tests/boot/**
      - config/platforms.json
      - .github/workflows/boot-test-iscsi.yml
  workflow_dispatch:
    inputs:
      channel:
        description: Flatcar channel
        type: choice
        required: true
        default: stable
        options: [stable, lts, beta, alpha]
      version:
        description: Flatcar version, e.g. 4757.2.3
        type: string
        required: true
        default: 4757.2.3

permissions: {}

concurrency:
  group: boot-test-iscsi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      # Pull requests use a fixed release: the check is about the recipe, not the release.
      CHANNEL: ${{ inputs.channel || 'stable' }}
      VERSION: ${{ inputs.version || '4757.2.3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools and make KVM usable
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends btrfs-progs fakeroot mtools dosfstools e2fsprogs gdisk qemu-utils cpio kmod patch binutils xz-utils qemu-system-x86 ovmf liblzma-dev
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the image
        run: |
          export WORKDIR="$RUNNER_TEMP/work" CACHE_DIR="$RUNNER_TEMP/cache"
          scripts/build.sh "$CHANNEL" "$VERSION" amd64 oraclecloud-iscsi "$RUNNER_TEMP/out"
      - name: Boot test
        run: |
          export WORKDIR="$RUNNER_TEMP/boot-test" CACHE_DIR="$RUNNER_TEMP/cache"
          scripts/boot-test-iscsi.sh "$RUNNER_TEMP/out/flatcar-oraclecloud-iscsi-$CHANNEL-$VERSION-amd64.qcow2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: boot-test-logs
          path: ${{ runner.temp }}/boot-test/*.log
          if-no-files-found: ignore
